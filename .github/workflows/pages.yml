name: Publicar Dashboard KPI RA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar V9 sem bloquear a interface
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('var DATA=');
          const end = html.indexOf('var DATA_ORIGINAL', start);
          if (start < 0 || end < 0 || end <= start) throw new Error('Não foi possível localizar a base DATA da V9.');

          const dataExpr = html.slice(start + 'var DATA='.length, end).trim().replace(/;\s*$/, '');
          if (!dataExpr || dataExpr.length < 1000) throw new Error('A base V9 está vazia ou incompleta.');
          console.log('Base V9 extraída:', dataExpr.length, 'caracteres.');

          fs.writeFileSync('data.js', 'window.__RA_DATA__=' + dataExpr + ';\\n');

          let app = html.slice(html.indexOf('<script>') + 8, html.lastIndexOf('</script>'));
          app = app.replace(/^var DATA=\[.*?\];\s*/s, 'var DATA=window.__RA_DATA__||[];\\n');
          app = app.replace(/var DATA_ORIGINAL\s*=\s*DATA\.slice\(\);/, 'var DATA_ORIGINAL = DATA.slice();');
          
          // Guarda a última leitura bem-sucedida da planilha para uso quando ela estiver temporariamente indisponível.
          const marker = 'function reloadLive(manual){';
          if (!app.includes('function saveLiveCSV(')) {
            app = app.replace(marker,
              'function saveLiveCSV(text){try{localStorage.setItem("kra_last_csv",text);localStorage.setItem("kra_last_csv_at",new Date().toISOString());}catch(e){}}\\n' +
              'function loadLastCSV(){try{return localStorage.getItem("kra_last_csv")||"";}catch(e){return ""}}\\n' +
              marker);
          }
          app = app.replace('processUpload(text);\\n      filtered = DATA.slice();',
            'saveLiveCSV(text);\\n      processUpload(text);\\n      filtered = DATA.slice();');

          fs.writeFileSync('app.js', app);

          const main = html.slice(0, html.indexOf('<script>'));
          const tail = html.slice(html.lastIndexOf('</script>') + 9);
          const out = main + '<script src="data.js" defer></script>\\n<script src="app.js" defer></script>\\n' + tail;
          fs.writeFileSync('index.html', out);

          console.log('Arquivos separados e prontos para publicação.');
          console.log('index.html:', fs.statSync('index.html').size, 'bytes');
          console.log('data.js:', fs.statSync('data.js').size, 'bytes');
          console.log('app.js:', fs.statSync('app.js').size, 'bytes');
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
