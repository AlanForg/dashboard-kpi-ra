<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard KPI RA v6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f4f8;color:#1e293b;font-size:14px}
.header{background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:19px;font-weight:700}
.header-sub{font-size:12px;opacity:.8}
.header a{color:#93c5fd;text-decoration:none;font-size:13px}
.header a:hover{text-decoration:underline}
.filters{background:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.filters label{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.filters select{padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;background:#fff;cursor:pointer;max-width:160px}
.filters select:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.btn-limpar{padding:5px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;background:#ef4444;color:#fff;font-weight:600}
.btn-limpar:hover{background:#dc2626}
.tabs{display:flex;gap:0;background:#fff;border-bottom:2px solid #e2e8f0;padding:0 20px;overflow-x:auto}
.tab-btn{padding:11px 16px;border:none;background:none;cursor:pointer;font-size:13px;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500;transition:color .15s}
.tab-btn:hover{color:#2563eb}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:700}
.content{padding:20px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.kpi-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:140px;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:4px solid #2563eb}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.kpi-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi-value{font-size:26px;font-weight:700;margin-top:3px;line-height:1.1}
.kpi-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-bottom:14px}
.chart-card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;position:relative}
.chart-card:hover .card-actions{opacity:1}
.card-header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:14px;font-weight:700;color:#1e293b}
.card-actions{opacity:0;transition:opacity .2s;display:flex;gap:4px}
.card-action{background:none;border:1px solid #e2e8f0;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:12px;color:#64748b}
.card-action:hover{background:#f1f5f9}
.card-body{padding:6px 16px 14px}
.bar-row{display:flex;align-items:center;margin-bottom:5px}
.bar-label{width:160px;min-width:160px;text-align:right;padding-right:10px;font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:24px;background:#f1f5f9;border-radius:4px;position:relative;margin-right:55px}
.bar-fill{height:100%;border-radius:4px;max-width:92%;min-width:2px;transition:width .3s}
.bar-value{position:absolute;right:-52px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:#1e293b;white-space:nowrap}
.stacked-row{display:flex;align-items:center;margin-bottom:5px}
.stacked-label{width:100px;min-width:100px;text-align:right;padding-right:10px;font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stacked-track{flex:1;height:24px;display:flex;border-radius:4px;overflow:hidden;background:#f1f5f9;gap:1px}
.stacked-seg{height:100%;position:relative;cursor:default}
.stacked-seg:hover{opacity:.85}
.stacked-value{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.4)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#475569}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:#f8fafc;padding:8px 10px;text-align:left;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.data-table th:hover{background:#eef2f7}
.data-table td{padding:7px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.data-table tr:hover{background:#f8fafc}
.data-table .sort-arrow{font-size:10px;margin-left:3px;color:#94a3b8}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge-red{background:#fef2f2;color:#dc2626}
.badge-green{background:#f0fdf4;color:#059669}
.badge-blue{background:#eff6ff;color:#2563eb}
.badge-orange{background:#fffbeb;color:#d97706}
.badge-purple{background:#f5f3ff;color:#7c3aed}
.badge-slate{background:#f1f5f9;color:#64748b}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e2e8f0}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#64748b;padding:4px 8px}
.modal-close:hover{color:#1e293b}
.edit-table{width:100%;border-collapse:collapse;margin:12px 0}
.edit-table th,.edit-table td{border:1px solid #e2e8f0;padding:6px 10px;font-size:13px}
.edit-table th{background:#f8fafc;font-weight:600}
.edit-table input[type=text],.edit-table input[type=number]{width:100%;border:1px solid #cbd5e1;border-radius:4px;padding:4px 6px;font-size:13px}
.edit-table input[type=color]{width:36px;height:28px;border:none;cursor:pointer}
.btn-apply{background:#2563eb;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;margin-top:8px}
.btn-apply:hover{background:#1d4ed8}
.upload-area{border:2px dashed #cbd5e1;border-radius:12px;padding:36px;text-align:center;margin:20px 0;background:#fafbfc}
.upload-area:hover{border-color:#2563eb;background:#eff6ff}
.upload-input{margin:14px 0}
.upload-feedback{padding:12px 16px;border-radius:8px;margin-top:14px;font-weight:600;font-size:14px}
.upload-ok{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}
.upload-err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.paste-area{width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;resize:vertical}
.premissa-section{background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.premissa-section h3{font-size:15px;margin-bottom:10px;color:#1e3a5f;border-bottom:1px solid #e2e8f0;padding-bottom:6px}
.premissa-list{list-style:disc;padding-left:20px}
.premissa-list li{margin-bottom:6px;font-size:13px;line-height:1.6;color:#475569}
.premissa-list code{background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:12px;color:#7c3aed}
.donut-wrap{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;padding:8px 0}
.record-count{font-size:12px;color:#94a3b8;padding:4px 0}
.table-scroll{overflow-x:auto;max-height:500px;overflow-y:auto}
.full-width{grid-column:1/-1}
.tooltip{position:absolute;background:#1e293b;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;pointer-events:none;z-index:100;white-space:nowrap}
@media(max-width:768px){
.chart-grid{grid-template-columns:1fr}
.kpi-row{flex-direction:column}
.filters{flex-direction:column;align-items:stretch}
.bar-label{width:100px;min-width:100px;font-size:11px}
.header{flex-direction:column;text-align:center}
}
</style>
</head>

function el(id){return document.getElementById(id)}
function ce(tag){return document.createElement(tag)}

function escHtml(s){
  if(!s)return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fmtNum(n){
  if(n===null||n===undefined||n!==n)return "0";
  var s=String(Math.round(n*100)/100);
  var parts=s.split(".");
  var intPart=parts[0];
  var dec=parts[1]||"";
  var res="";
  var c=0;
  for(var i=intPart.length-1;i>=0;i--){
    if(c>0&&c%3===0)res="."+res;
    res=intPart[i]+res;
    c++;
  }
  if(dec)res=res+","+dec;
  return res;
}

function fmtPct(a,b){
  if(!b)return "0%";
  return (Math.round(a/b*1000)/10)+"%";
}

function countBy(arr,key){
  var m={};
  for(var i=0;i<arr.length;i++){
    var v=arr[i][key]||"(vazio)";
    m[v]=(m[v]||0)+1;
  }
  return m;
}

function countByFn(arr,fn){
  var m={};
  for(var i=0;i<arr.length;i++){
    var v=fn(arr[i]);
    if(v===null||v===undefined)continue;
    m[v]=(m[v]||0)+1;
  }
  return m;
}

function sumByKey(arr,key){
  var s=0;
  for(var i=0;i<arr.length;i++){
    var v=parseFloat(arr[i][key]);
    if(!isNaN(v))s+=v;
  }
  return s;
}

function avgByKey(arr,key){
  var s=0,c=0;
  for(var i=0;i<arr.length;i++){
    var v=parseFloat(arr[i][key]);
    if(!isNaN(v)&&arr[i][key]!==""){s+=v;c++;}
  }
  return c>0?s/c:0;
}

function topN(countObj,n){
  var arr=[];
  for(var k in countObj){
    if(countObj.hasOwnProperty(k))arr.push({label:k,value:countObj[k]});
  }
  arr.sort(function(a,b){return b.value-a.value});
  return arr.slice(0,n);
}

function sortedByOrder(countObj,order){
  var arr=[];
  for(var i=0;i<order.length;i++){
    arr.push({label:order[i],value:countObj[order[i]]||0});
  }
  return arr;
}

function uniqueVals(arr,key){
  var seen={};var result=[];
  for(var i=0;i<arr.length;i++){
    var v=arr[i][key];
    if(v&&!seen[v]){seen[v]=1;result.push(v);}
  }
  return result.sort();
}

function classifyFaixa(fx){
  if(!fx||fx==="PENDENTE")return "PENDENTE";
  if(fx==="Mesmo dia")return "Mesmo dia";
  if(fx==="1 dia")return "1 dia";
  if(fx==="2 dias")return "2 dias";
  if(fx==="3 dias")return "3 dias";
  return "4+ dias";
}

function parseDias(dp){
  var v=parseInt(dp,10);
  return isNaN(v)?null:v;
}

function buildFilters(){
  var bar=el("filters-bar");
  var fields=[
    {id:"f-sem",key:"sem",label:"Semana"},
    {id:"f-ma",key:"ma",label:"Mês/Ano"},
    {id:"f-e",key:"e",label:"Estado"},
    {id:"f-ag",key:"ag",label:"Agente"},
    {id:"f-mt",key:"mt",label:"Motivo"},
    {id:"f-sr",key:"sr",label:"Status RA"},
    {id:"f-sh",key:"sh",label:"Status HugMe"},
    {id:"f-fx",key:"fx",label:"Faixa"}
  ];
  var html="";
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    var vals=uniqueVals(DATA_ORIGINAL,f.key);
    html+="<div><label>"+escHtml(f.label)+"</label><br>";
    html+="<select id=\""+f.id+"\" onchange=\"applyFilters()\">";
    html+="<option value=\"\">Todos</option>";
    for(var j=0;j<vals.length;j++){
      html+="<option value=\""+escHtml(vals[j])+"\">"+escHtml(vals[j])+"</option>";
    }
    html+="</select></div>";
  }
  html+="<div style=\"display:flex;align-items:flex-end\"><button class=\"btn-limpar\" onclick=\"clearFilters()\">Limpar</button></div>";
  bar.innerHTML=html;
}

  var mt=el("f-mt").value;
  var sr=el("f-sr").value;
  var sh=el("f-sh").value;
  var fx=el("f-fx").value;
  filtered=[];
  for(var i=0;i<DATA_ORIGINAL.length;i++){
    var r=DATA_ORIGINAL[i];
    if(sem&&r.sem!==sem)continue;
    if(ma&&r.ma!==ma)continue;
    if(e&&r.e!==e)continue;
    if(ag&&r.ag!==ag)continue;
    if(mt&&r.mt!==mt)continue;
    if(sr&&r.sr!==sr)continue;
    if(sh&&r.sh!==sh)continue;
    if(fx&&r.fx!==fx)continue;
    filtered.push(r);
  }
  renderActiveTab();
}

function clearFilters(){
  var sels=document.querySelectorAll(".filters select");
  for(var i=0;i<sels.length;i++)sels[i].value="";
  applyFilters();
}

/* ========== TAB SYSTEM ========== */
function buildTabs(){
  var bar=el("tab-bar");
  var html="";
  for(var i=0;i<TABS.length;i++){
    var t=TABS[i];
    var cls="tab-btn"+(t.id===activeTab?" active":"");
    html+="<button class=\""+cls+"\" data-tab=\""+t.id+"\" onclick=\"switchTab(this.getAttribute('data-tab'))\">"+t.label+"</button>";
  }
  bar.innerHTML=html;
}

function switchTab(tab){
  activeTab=tab;
  var btns=document.querySelectorAll(".tab-btn");
  for(var i=0;i<btns.length;i++){
    btns[i].className=btns[i].getAttribute("data-tab")===tab?"tab-btn active":"tab-btn";
  }
  var panels=document.querySelectorAll(".tab-panel");
  for(var i=0;i<panels.length;i++){
    panels[i].className=panels[i].id==="panel-"+tab?"tab-panel active":"tab-panel";
  }
  renderActiveTab();
}

function renderActiveTab(){
  switch(activeTab){
    case "analise":renderAnalise();break;
    case "tempo":renderTempo();break;
    case "prod":renderProd();break;
    case "csat":renderCSAT();break;
    case "tabela":renderTabela();break;
    case "duplic":renderDuplic();break;
    case "base":renderBase();break;
    case "premissas":renderPremissas();break;
  }
}

function makeKPIRow(parentId,kpis){
  var html="<div class=\"kpi-row\">";
  for(var i=0;i<kpis.length;i++){
    var k=kpis[i];
    var borderColor=k.color||COLORS.blue;
    html+="<div class=\"kpi-card\" style=\"border-left-color:"+borderColor+"\" onclick=\"openKPIModal()\">";
    html+="<div class=\"kpi-label\">"+escHtml(k.label)+"</div>";
    html+="<div class=\"kpi-value\" style=\"color:"+borderColor+"\">"+k.value+"</div>";
    if(k.sub)html+="<div class=\"kpi-sub\">"+escHtml(k.sub)+"</div>";
    html+="</div>";
  }
  html+="</div>";
  return html;
}

function makeCard(parentEl,cardId,title){

function renderBarChart(bodyId,items,opts){
  opts=opts||{};
  var color=opts.color||COLORS.blue;
  var labelW=opts.labelWidth||160;
  var maxVal=0;
  for(var i=0;i<items.length;i++){
    if(items[i].value>maxVal)maxVal=items[i].value;
  }
  _cards[bodyId.replace("body-","")]={title:opts.title||"",items:items,color:color,type:"bar"};
  var html="";
  for(var i=0;i<items.length;i++){
    var pct=maxVal>0?(items[i].value/maxVal*100):0;
    var barW=Math.max(Math.min(pct*0.48,48),0.5);
    var displayVal=items[i].suffix?fmtNum(items[i].value)+items[i].suffix:fmtNum(items[i].value);
    html+="<div class=\"bar-row\">";
    html+="<div class=\"bar-label\" style=\"width:"+labelW+"px;min-width:"+labelW+"px\" title=\""+escHtml(items[i].label)+"\">"+escHtml(items[i].label)+"</div>";
    html+="<div class=\"bar-track\" style=\"margin-right:55px\">";
    html+="<div class=\"bar-fill\" style=\"width:"+barW+"%;background:"+color+"\"></div>";
    html+="<div class=\"bar-value\">"+displayVal+"</div>";
    html+="</div></div>";
  }
  el(bodyId).innerHTML=html;
}

function renderStackedBar(bodyId,groups,cats,colors,opts){
  opts=opts||{};
  _cards[bodyId.replace("body-","")]={title:opts.title||"",groups:groups,cats:cats,colors:colors,type:"stacked"};
  var maxVal=0;
  for(var i=0;i<groups.length;i++){
    var total=0;
    for(var j=0;j<cats.length;j++){
      total+=(groups[i].values[cats[j]]||0);
    }
    if(total>maxVal)maxVal=total;
  }
  var html="<div class=\"legend\">";
  for(var j=0;j<cats.length;j++){
    html+="<div class=\"legend-item\"><span class=\"legend-dot\" style=\"background:"+colors[j]+"\"></span>"+escHtml(cats[j])+"</div>";
  }
  html+="</div>";
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    var total=0;
    for(var j=0;j<cats.length;j++)total+=(g.values[cats[j]]||0);
    html+="<div class=\"stacked-row\">";
    html+="<div class=\"stacked-label\" title=\""+escHtml(g.label)+"\">"+escHtml(g.label)+"</div>";
    html+="<div class=\"stacked-track\">";
    for(var j=0;j<cats.length;j++){
      var v=g.values[cats[j]]||0;
      if(v===0)continue;
      var pct=maxVal>0?(v/maxVal*100):0;
      html+="<div class=\"stacked-seg\" style=\"width:"+pct+"%;background:"+colors[j]+"\" title=\""+escHtml(cats[j])+": "+v+"\">";
      if(pct>6)html+="<span class=\"stacked-value\">"+v+"</span>";
      html+="</div>";
    }
    html+="</div>";
    html+="<span style=\"font-size:12px;font-weight:600;margin-left:6px;min-width:35px\">"+total+"</span>";
    html+="</div>";
  }
  el(bodyId).innerHTML=html;
}

function renderDonut(bodyId,segments,opts){
  opts=opts||{};
  _cards[bodyId.replace("body-","")]={title:opts.title||"",items:segments.map(function(s){return{label:s.label,value:s.value}}),color:segments[0]?segments[0].color:COLORS.blue,type:"donut"};
  var total=0;
  for(var i=0;i<segments.length;i++)total+=segments[i].value;
  var r=65,cx=80,cy=80,sw=22;
  var circ=2*Math.PI*r;
  var offset=0;
  var svg="<svg width=\"160\" height=\"160\" viewBox=\"0 0 160 160\">";
  for(var i=0;i<segments.length;i++){
    var pct=total>0?segments[i].value/total:0;
    var dashLen=pct*circ;
    var dashGap=circ-dashLen;
    svg+="<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\""+r+"\" fill=\"none\" stroke=\""+segments[i].color+"\" stroke-width=\""+sw+"\"";
    svg+=" stroke-dasharray=\""+dashLen+" "+dashGap+"\"";
    svg+=" stroke-dashoffset=\""+(-offset)+"\"";
    svg+=" transform=\"rotate(-90 "+cx+" "+cy+")\"/>";
    offset+=dashLen;
  }
  var centerText=opts.centerText||String(total);
  svg+="<text x=\""+cx+"\" y=\""+cy+"\" text-anchor=\"middle\" dominant-baseline=\"central\" font-size=\"18\" font-weight=\"700\" fill=\"#1e293b\">"+centerText+"</text>";
  svg+="</svg>";
  var legend="<div style=\"text-align:left\">";
  for(var i=0;i<segments.length;i++){
    var pctStr=total>0?Math.round(segments[i].value/total*100):0;
    legend+="<div class=\"legend-item\" style=\"margin-bottom:4px\"><span class=\"legend-dot\" style=\"background:"+segments[i].color+"\"></span><strong>"+escHtml(segments[i].label)+":</strong>&nbsp;"+fmtNum(segments[i].value)+" ("+pctStr+"%)</div>";
  }
  legend+="</div>";
  el(bodyId).innerHTML="<div class=\"donut-wrap\">"+svg+legend+"</div>";
}

function renderDataTable(bodyId,headers,rows,opts){
  opts=opts||{};
  var tableId=bodyId.replace("body-","")+"_tbl";
  _cards[bodyId.replace("body-","")]={title:opts.title||"",headers:headers,rows:rows,type:"table"};
  var html="<div class=\"table-scroll\"><table class=\"data-table\" id=\""+tableId+"\">";
  html+="<thead><tr>";
  for(var j=0;j<headers.length;j++){
    html+="<th onclick=\"sortTable('"+tableId+"',"+j+")\">"+escHtml(headers[j])+"<span class=\"sort-arrow\">&#9650;&#9660;</span></th>";
  }
  html+="</tr></thead><tbody>";
  for(var i=0;i<rows.length;i++){
    html+="<tr>";
    for(var j=0;j<rows[i].length;j++){
      html+="<td>"+escHtml(String(rows[i][j]!=null?rows[i][j]:""))+"</td>";
    }
    html+="</tr>";
  }
  html+="</tbody></table></div>";
  if(opts.showCount!==false)html+="<div class=\"record-count\">"+rows.length+" registros</div>";
  el(bodyId).innerHTML=html;
}

function sortTable(tableId,colIdx){
  var table=document.getElementById(tableId);
  if(!table)return;
  var tbody=table.querySelector("tbody");
  var rows=[];
  var trs=tbody.querySelectorAll("tr");
  for(var i=0;i<trs.length;i++){
    var cells=trs[i].querySelectorAll("td");
    var val=cells[colIdx]?cells[colIdx].textContent:"";
    rows.push({el:trs[i],val:val});
  }
  var key=tableId+"_"+colIdx;
  var asc=_sortState[key]!==true;
  _sortState[key]=asc;
  rows.sort(function(a,b){
    var va=parseFloat(a.val.replace(/\./g,"").replace(",","."));
    var vb=parseFloat(b.val.replace(/\./g,"").replace(",","."));
    if(!isNaN(va)&&!isNaN(vb))return asc?va-vb:vb-va;
    return asc?a.val.localeCompare(b.val):b.val.localeCompare(a.val);
  });
  for(var i=0;i<rows.length;i++)tbody.appendChild(rows[i].el);
}


/* ========== TAB: ANALISE RA ========== */
function renderAnalise(){
  var panel=el("panel-analise");
  var d=filtered;
  var total=d.length;
  var respondidos=0,avaliados=0,notaSum=0,notaCount=0,promotores=0,detratores=0;
  for(var i=0;i<d.length;i++){
    if(d[i].rp==="Sim")respondidos++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){
      avaliados++;notaSum+=nota;notaCount++;
      if(nota>=9)promotores++;
      else if(nota<7)detratores++;
    }
  }
  var semResp=total-respondidos;
  var notaMedia=notaCount>0?(notaSum/notaCount):0;
  var nps=avaliados>0?Math.round((promotores-detratores)/avaliados*100):0;

  var html=makeKPIRow("panel-analise",[
    {label:"Total",value:fmtNum(total),sub:fmtPct(total,total),color:COLORS.blue},
    {label:"Respondidos",value:fmtNum(respondidos),sub:fmtPct(respondidos,total),color:COLORS.green},
    {label:"Sem Resposta",value:fmtNum(semResp),sub:fmtPct(semResp,total),color:COLORS.red},
    {label:"Avaliados",value:fmtNum(avaliados),sub:fmtPct(avaliados,total),color:COLORS.purple},
    {label:"Nota Média",value:(Math.round(notaMedia*10)/10).toFixed(1),sub:"escala 0-10",color:COLORS.orange},
    {label:"NPS",value:nps,sub:"promotores - detratores",color:nps>=0?COLORS.green:COLORS.red}
  ]);
  panel.innerHTML=html;

  var grid=ce("div");grid.className="chart-grid";
  panel.appendChild(grid);

  // Volume Dia Semana
  var diaCounts=countBy(d,"ds");
  var diaItems=sortedByOrder(diaCounts,DIAS_ORDER);
  var bid1=makeCardInGrid(grid,"an-diasem","Volume por Dia da Semana");
  renderBarChart(bid1,diaItems,{color:COLORS.blue,title:"Volume por Dia da Semana"});

  // Status RA
  var srCounts=countBy(d,"sr");
  var srItems=topN(srCounts,10);
  var bid2=makeCardInGrid(grid,"an-statusra","Status RA");
  renderBarChart(bid2,srItems,{color:COLORS.purple,title:"Status RA"});

  // Status HugMe
  var shCounts=countBy(d,"sh");
  var shItems=topN(shCounts,10);
  var bid3=makeCardInGrid(grid,"an-statushm","Status HugMe");
  renderBarChart(bid3,shItems,{color:COLORS.teal,title:"Status HugMe"});

  // Top 10 Motivos
  var mtCounts=countBy(d,"mt");
  var mtItems=topN(mtCounts,10);
  var bid4=makeCardInGrid(grid,"an-motivos","Top 10 Motivos");
  renderBarChart(bid4,mtItems,{color:COLORS.orange,title:"Top 10 Motivos"});

  // Top 10 Estados
  var eCounts=countBy(d,"e");
  var eItems=topN(eCounts,10);
  var bid5=makeCardInGrid(grid,"an-estados","Top 10 Estados");
  renderBarChart(bid5,eItems,{color:COLORS.green,title:"Top 10 Estados"});

  // Top 15 Tags
  var tagCounts={};
  for(var i=0;i<d.length;i++){
    var tags=d[i].t;
    if(!tags)continue;
    var parts=tags.split(";");
    for(var j=0;j<parts.length;j++){
      var tag=parts[j].replace(/^\s+|\s+$/g,"");
      if(tag)tagCounts[tag]=(tagCounts[tag]||0)+1;
    }
  }
  var tagItems=topN(tagCounts,15);
  var bid6=makeCardInGrid(grid,"an-tags","Top 15 Tags","full-width");
  renderBarChart(bid6,tagItems,{color:COLORS.sky,title:"Top 15 Tags",labelWidth:220});
}

/* ========== TAB: TEMPO DE RESPOSTA ========== */
function renderTempo(){
  var panel=el("panel-tempo");
  var d=filtered;

  var tpVals=[],mesmoDia=0,ate3d=0,maior3d=0,pendentes=0,totalResp=0;
  for(var i=0;i<d.length;i++){
    var fx=classifyFaixa(d[i].fx);
    if(fx==="PENDENTE"){pendentes++;continue;}
    totalResp++;
    if(fx==="Mesmo dia")mesmoDia++;
    var dpVal=parseDias(d[i].dp);
    if(dpVal!==null&&dpVal<=3)ate3d++;
    else if(dpVal!==null&&dpVal>3)maior3d++;
    var tp=parseFloat(d[i].tp);
    if(!isNaN(tp)&&d[i].tp!=="")tpVals.push(tp);
  }
  var tempMed=tpVals.length>0?(tpVals.reduce(function(a,b){return a+b},0)/tpVals.length):0;
  var tempMedMin=Math.round(tempMed);
  var tempMedHrs=(tempMed/60).toFixed(1);

  var html=makeKPIRow("panel-tempo",[
    {label:"Tempo Médio 1ª Resp",value:fmtNum(tempMedMin)+"min",sub:tempMedHrs+"h",color:COLORS.blue},
    {label:"Mesmo Dia",value:fmtNum(mesmoDia),sub:fmtPct(mesmoDia,d.length),color:COLORS.green},
    {label:"Até 3 Dias",value:fmtNum(ate3d),sub:fmtPct(ate3d,d.length),color:COLORS.teal},
    {label:"> 3 Dias",value:fmtNum(maior3d),sub:fmtPct(maior3d,d.length),color:COLORS.orange},
    {label:"Pendentes",value:fmtNum(pendentes),sub:fmtPct(pendentes,d.length),color:COLORS.red}
  ]);
  panel.innerHTML=html;

  var grid=ce("div");grid.className="chart-grid";
  panel.appendChild(grid);

  // Faixas de Resposta
  var fxCounts={};
  for(var i=0;i<d.length;i++){
    var fx=classifyFaixa(d[i].fx);
    fxCounts[fx]=(fxCounts[fx]||0)+1;
  }
  var fxItems=[];
  for(var i=0;i<FAIXA_GROUPS.length;i++){
    fxItems.push({label:FAIXA_GROUPS[i],value:fxCounts[FAIXA_GROUPS[i]]||0});
  }
  var bid1=makeCardInGrid(grid,"tp-faixas","Faixas de Resposta");
  renderBarChartMultiColor(bid1,fxItems,FAIXA_COLORS,{title:"Faixas de Resposta"});

  // Tempo Médio por Dia
  var diaTempos={};
  for(var i=0;i<d.length;i++){
    var ds=d[i].ds;
    var tp=parseFloat(d[i].tp);
    if(!isNaN(tp)&&d[i].tp!==""&&ds){
      if(!diaTempos[ds])diaTempos[ds]={sum:0,count:0};
      diaTempos[ds].sum+=tp;
      diaTempos[ds].count++;
    }
  }
  var diaAvgItems=[];
  for(var i=0;i<DIAS_ORDER.length;i++){
    var ds=DIAS_ORDER[i];
    var avg=diaTempos[ds]?(diaTempos[ds].sum/diaTempos[ds].count):0;
    diaAvgItems.push({label:ds,value:Math.round(avg),suffix:" min"});
  }
  var bid2=makeCardInGrid(grid,"tp-diamed","Tempo Médio por Dia da Semana");
  renderBarChart(bid2,diaAvgItems,{color:COLORS.blue,title:"Tempo Médio por Dia da Semana"});

  // Pendentes Table
  var pendList=[];
  for(var i=0;i<d.length;i++){
    if(d[i].fx==="PENDENTE"){
      var hpVal=d[i].hp;
      var hpDisplay=(!hpVal||hpVal==="0")?"<span class=\"badge badge-red\">Não respondido</span>":hpVal+"h";
      pendList.push([d[i].d,d[i].ag||"(sem agente)",d[i].mt||"",d[i].c||"",d[i].sr||"",hpDisplay]);
    }
  }
  var bid3=makeCardInGrid(grid,"tp-pendentes","Pendentes","full-width");
  var pendHtml="<div class=\"table-scroll\"><table class=\"data-table\"><thead><tr><th>Data</th><th>Agente</th><th>Motivo</th><th>Cidade</th><th>Status RA</th><th>Horas Sem Resp</th></tr></thead><tbody>";
  for(var i=0;i<Math.min(pendList.length,100);i++){
    pendHtml+="<tr>";
    for(var j=0;j<pendList[i].length;j++){
      pendHtml+="<td>"+pendList[i][j]+"</td>";
    }
    pendHtml+="</tr>";
  }
  pendHtml+="</tbody></table></div>";
  if(pendList.length>100)pendHtml+="<div class=\"record-count\">Exibindo 100 de "+pendList.length+" pendentes</div>";
  else pendHtml+="<div class=\"record-count\">"+pendList.length+" pendentes</div>";
  el(bid3).innerHTML=pendHtml;
  _cards["tp-pendentes"]={title:"Pendentes",headers:["Data","Agente","Motivo","Cidade","Status RA","Horas Sem Resp"],rows:pendList,type:"table"};

  // Entrada x Dias - by week
  var entradaDias={};
  var semanas=uniqueVals(d,"sem");
  for(var i=0;i<d.length;i++){
    var sem=d[i].sem||"?";
    var dp=d[i].dp||"PEND";
    if(!entradaDias[sem])entradaDias[sem]={};
    entradaDias[sem][dp]=(entradaDias[sem][dp]||0)+1;
  }
  var edHeaders=["Semana","Total","Mesmo dia","1d","2d","3d",">3d","PEND"];
  var edRows=[];
  for(var i=0;i<semanas.length;i++){
    var s=semanas[i];
    var rowData=entradaDias[s]||{};
    var totalS=0;for(var k in rowData)if(rowData.hasOwnProperty(k))totalS+=rowData[k];
    edRows.push([s,totalS,rowData["0"]||0,rowData["1"]||0,rowData["2"]||0,rowData["3"]||0,
      (function(){var sum=0;for(var k in rowData){if(rowData.hasOwnProperty(k)){var n=parseInt(k);if(!isNaN(n)&&n>3)sum+=rowData[k]}}return sum})(),
      rowData["PEND"]||rowData[""]||0]);
  }
  var bid4=makeCardInGrid(grid,"tp-entrada","Entrada por Semana");
  renderDataTable(bid4,edHeaders,edRows,{title:"Entrada por Semana"});

  // Faixas x Semana stacked
  var fxSemData=[];
  for(var i=0;i<semanas.length;i++){
    var s=semanas[i];
    var vals={};
    for(var j=0;j<d.length;j++){
      if(d[j].sem===s){
        var fx=classifyFaixa(d[j].fx);
        vals[fx]=(vals[fx]||0)+1;
      }
    }
    fxSemData.push({label:"Sem "+s,values:vals});
  }
  var bid5=makeCardInGrid(grid,"tp-fxsem","Faixas por Semana","full-width");
  renderStackedBar(bid5,fxSemData,FAIXA_GROUPS,FAIXA_COLORS,{title:"Faixas por Semana"});
}

  var d=filtered;

  var agents=uniqueVals(d,"ag");
  if(agents.length===0)agents=["(sem agente)"];
  var agData={};
  for(var a=0;a<agents.length;a++){
    agData[agents[a]]={total:0,resp:0,notaSum:0,notaCount:0};
  }
  for(var i=0;i<d.length;i++){
    var ag=d[i].ag||"(sem agente)";
    if(!agData[ag])agData[ag]={total:0,resp:0,notaSum:0,notaCount:0};
    agData[ag].total++;
    if(d[i].rp==="Sim")agData[ag].resp++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){agData[ag].notaSum+=nota;agData[ag].notaCount++;}
  }

  // KPIs per agent
  var kpis=[];
  for(var a=0;a<agents.length;a++){
    var ag=agents[a];
    var ad=agData[ag];
    var taxa=ad.total>0?Math.round(ad.resp/ad.total*100):0;
    var notaM=ad.notaCount>0?(ad.notaSum/ad.notaCount):0;
    kpis.push({label:ag,value:fmtNum(ad.total),sub:"Resp: "+fmtNum(ad.resp)+" ("+taxa+"%) | Nota: "+(Math.round(notaM*10)/10).toFixed(1),color:PALETTE[a%PALETTE.length]});
  }
  var html=makeKPIRow("panel-prod",kpis);
  panel.innerHTML=html;

  var grid=ce("div");grid.className="chart-grid";
  panel.appendChild(grid);

  // Volume por Agente
  var volItems=[];
  for(var a=0;a<agents.length;a++){
    volItems.push({label:agents[a],value:agData[agents[a]].total});
  }
  volItems.sort(function(a,b){return b.value-a.value});
  var bid1=makeCardInGrid(grid,"pr-vol","Volume por Agente");
  renderBarChart(bid1,volItems,{color:COLORS.blue,title:"Volume por Agente"});

  // Taxa Resposta por Agente
  var taxaItems=[];
  for(var a=0;a<agents.length;a++){
    var ad=agData[agents[a]];
    var taxa=ad.total>0?Math.round(ad.resp/ad.total*100):0;
    taxaItems.push({label:agents[a],value:taxa,suffix:"%"});
  }
  taxaItems.sort(function(a,b){return b.value-a.value});
  var bid2=makeCardInGrid(grid,"pr-taxa","Taxa de Resposta por Agente");
  renderBarChart(bid2,taxaItems,{color:COLORS.green,title:"Taxa de Resposta por Agente"});

  // Nota por Agente
  var notaItems=[];
  for(var a=0;a<agents.length;a++){
    var ad=agData[agents[a]];
    var notaM=ad.notaCount>0?(Math.round(ad.notaSum/ad.notaCount*10)/10):0;
    notaItems.push({label:agents[a],value:notaM});
  }
  notaItems.sort(function(a,b){return b.value-a.value});
  var bid3=makeCardInGrid(grid,"pr-nota","Nota Média por Agente");
  renderBarChart(bid3,notaItems,{color:COLORS.orange,title:"Nota Média por Agente"});

  // Faixas por Agente stacked
  var fxAgData=[];
  for(var a=0;a<agents.length;a++){
    var vals={};
    for(var i=0;i<d.length;i++){
      if((d[i].ag||"(sem agente)")===agents[a]){
        var fx=classifyFaixa(d[i].fx);
        vals[fx]=(vals[fx]||0)+1;
      }
    }
    fxAgData.push({label:agents[a],values:vals});
  }
  var bid4=makeCardInGrid(grid,"pr-fxag","Faixas por Agente","full-width");
  renderStackedBar(bid4,fxAgData,FAIXA_GROUPS,FAIXA_COLORS,{title:"Faixas por Agente"});

  // Daily Table
  var dailyMap={};
  var dates=[];
  for(var i=0;i<d.length;i++){
    var dt=d[i].d?d[i].d.split(" ")[0]:"?";
    var ag=d[i].ag||"(sem agente)";
    if(!dailyMap[dt]){dailyMap[dt]={};dates.push(dt);}
    if(!dailyMap[dt][ag])dailyMap[dt][ag]={total:0,notaSum:0,notaCount:0};
    dailyMap[dt][ag].total++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){dailyMap[dt][ag].notaSum+=nota;dailyMap[dt][ag].notaCount++;}
  }
  dates.sort();
  var dHeaders=["Data"];
  for(var a=0;a<agents.length;a++){dHeaders.push(agents[a]);dHeaders.push("Nota "+agents[a]);}
  dHeaders.push("Total");
  var dRows=[];
  for(var i=0;i<dates.length;i++){
    var row=[dates[i]];
    var totalDay=0;
    for(var a=0;a<agents.length;a++){
      var cell=dailyMap[dates[i]][agents[a]];
      var cnt=cell?cell.total:0;
      var ntM=cell&&cell.notaCount>0?(Math.round(cell.notaSum/cell.notaCount*10)/10).toFixed(1):"-";
      row.push(cnt);
      row.push(ntM);
      totalDay+=cnt;
    }
    row.push(totalDay);
    dRows.push(row);
  }
  var bid5=makeCardInGrid(grid,"pr-daily","Produtividade Diária","full-width");
  renderDataTable(bid5,dHeaders,dRows,{title:"Produtividade Diária"});

  // Weekly Table
  var weeklyMap={};
  var weeks=uniqueVals(d,"sem");
  for(var i=0;i<d.length;i++){
    var sem=d[i].sem||"?";
    var ag=d[i].ag||"(sem agente)";
    if(!weeklyMap[sem])weeklyMap[sem]={};
    if(!weeklyMap[sem][ag])weeklyMap[sem][ag]={total:0,notaSum:0,notaCount:0};
    weeklyMap[sem][ag].total++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){weeklyMap[sem][ag].notaSum+=nota;weeklyMap[sem][ag].notaCount++;}
  }
  var wHeaders=["Semana"];
  for(var a=0;a<agents.length;a++){wHeaders.push(agents[a]);wHeaders.push("Nota "+agents[a]);}
  wHeaders.push("Total");
  var wRows=[];
  for(var i=0;i<weeks.length;i++){
    var row=["Sem "+weeks[i]];
    var totalW=0;
    for(var a=0;a<agents.length;a++){
      var cell=weeklyMap[weeks[i]]?weeklyMap[weeks[i]][agents[a]]:null;
      var cnt=cell?cell.total:0;
      var ntM=cell&&cell.notaCount>0?(Math.round(cell.notaSum/cell.notaCount*10)/10).toFixed(1):"-";
      row.push(cnt);
      row.push(ntM);
      totalW+=cnt;
    }
    row.push(totalW);
    wRows.push(row);
  }
  var bid6=makeCardInGrid(grid,"pr-weekly","Produtividade Semanal","full-width");
  renderDataTable(bid6,wHeaders,wRows,{title:"Produtividade Semanal"});
}

/* ========== TAB: CSAT ========== */
function renderCSAT(){
  var panel=el("panel-csat");
  var d=filtered;

  var rvSim=0,rvNao=0,vnSim=0,vnNao=0,notaSum=0,notaCount=0;
  for(var i=0;i<d.length;i++){
    if(d[i].rv==="Sim")rvSim++;
    else if(d[i].rv==="Não")rvNao++;
    if(d[i].vn==="Sim")vnSim++;
    else if(d[i].vn==="Não")vnNao++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){notaSum+=nota;notaCount++;}
  }
  var notaMedia=notaCount>0?(notaSum/notaCount):0;

  var html=makeKPIRow("panel-csat",[
    {label:"Resolvido - Sim",value:fmtNum(rvSim),sub:fmtPct(rvSim,rvSim+rvNao),color:COLORS.green},
    {label:"Resolvido - Não",value:fmtNum(rvNao),sub:fmtPct(rvNao,rvSim+rvNao),color:COLORS.red},
    {label:"Voltaria - Sim",value:fmtNum(vnSim),sub:fmtPct(vnSim,vnSim+vnNao),color:COLORS.green},
    {label:"Voltaria - Não",value:fmtNum(vnNao),sub:fmtPct(vnNao,vnSim+vnNao),color:COLORS.red},
    {label:"Nota Média",value:(Math.round(notaMedia*10)/10).toFixed(1),sub:"de "+fmtNum(notaCount)+" avaliações",color:COLORS.orange}
  ]);
  panel.innerHTML=html;

  var grid=ce("div");grid.className="chart-grid";
  panel.appendChild(grid);

  // Resolvido donut
  var bid1=makeCardInGrid(grid,"cs-resolv","Seu problema foi resolvido?");
  renderDonut(bid1,[
    {label:"Sim",value:rvSim,color:COLORS.green},
    {label:"Não",value:rvNao,color:COLORS.red}
  ],{title:"Resolvido",centerText:fmtNum(rvSim+rvNao)});

  // Voltaria donut
  var bid2=makeCardInGrid(grid,"cs-volt","Voltaria a fazer negócio?");
  renderDonut(bid2,[
    {label:"Sim",value:vnSim,color:COLORS.green},
    {label:"Não",value:vnNao,color:COLORS.red}
  ],{title:"Voltaria",centerText:fmtNum(vnSim+vnNao)});

  // Distribuição de Notas
  var notaCounts={};
  for(var i=0;i<=10;i++)notaCounts[String(i)]=0;
  for(var i=0;i<d.length;i++){
    var n=d[i].n;
    if(n!==""&&!isNaN(parseInt(n))){
      notaCounts[String(parseInt(n))]=(notaCounts[String(parseInt(n))]||0)+1;
    }
  }
  var notaItems=[];
  for(var i=0;i<=10;i++){
    notaItems.push({label:"Nota "+i,value:notaCounts[String(i)]||0});
  }
  var notaColors=[];
  for(var i=0;i<=10;i++){
    if(i<7)notaColors.push(COLORS.red);
    else if(i<9)notaColors.push(COLORS.orange);
    else notaColors.push(COLORS.green);
  }
  var bid3=makeCardInGrid(grid,"cs-notas","Distribuição de Notas");
  renderBarChartMultiColor(bid3,notaItems,notaColors,{title:"Distribuição de Notas"});

  // Nota x Faixa
  var fxNotas={};
  for(var i=0;i<d.length;i++){
    var fx=classifyFaixa(d[i].fx);
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){
      if(!fxNotas[fx])fxNotas[fx]={sum:0,count:0};
      fxNotas[fx].sum+=nota;fxNotas[fx].count++;
    }
  }
  var fxNotaItems=[];
  for(var i=0;i<FAIXA_GROUPS.length;i++){
    var fn=fxNotas[FAIXA_GROUPS[i]];
    var avg=fn&&fn.count>0?(Math.round(fn.sum/fn.count*10)/10):0;
    fxNotaItems.push({label:FAIXA_GROUPS[i],value:avg});
  }
  var bid4=makeCardInGrid(grid,"cs-fxnota","Nota Média por Faixa de Resposta");
  renderBarChartMultiColor(bid4,fxNotaItems,FAIXA_COLORS,{title:"Nota Média por Faixa de Resposta"});
}

function handleFileUpload(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    processUpload(e.target.result);
  };
  reader.readAsText(input.files[0],"UTF-8");
}

function handlePaste(){
  var text=el("paste-area").value;
  if(!text||!text.replace(/\s/g,"")){
    showFeedback("Nenhum dado para processar.","err");
    return;
  }
  processUpload(text);
}

function processUpload(text){
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  var lines=text.split("\n");
  if(lines.length<2){
    showFeedback("Arquivo deve ter pelo menos 2 linhas (cabeçalho + dados).","err");
    return;
  }

  // Detect separator
  var headerLine=lines[0];
  var sep="\t";
  if(headerLine.indexOf("\t")===-1){
    if(headerLine.indexOf(";")===-1){
      sep=",";
    } else {
      sep=";";
    }
  }

  var headers=parseLine(headerLine,sep);
  // Build column index map
  var colMap={};
  var mappedCount=0;
  for(var i=0;i<headers.length;i++){
    var h=headers[i].replace(/^\s+|\s+$/g,"").replace(/^"|"$/g,"").replace(/^\s+|\s+$/g,"");
    if(HEADER_MAP[h]){
      colMap[i]=HEADER_MAP[h];
      mappedCount++;
    }
  }

  if(mappedCount===0){
    showFeedback("Nenhum cabeçalho reconhecido. Verifique se a primeira linha contém os nomes das colunas.","err");
    return;
  }

  var newData=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i].replace(/^\s+|\s+$/g,"");
    if(!line)continue;
    var cells=parseLine(line,sep);
    var record={d:"",sh:"",sr:"",c:"",e:"",t:"",dr:"",i:"",rv:"",vn:"",n:"",tp:"",ag:"",sem:"",ds:"",ma:"",mt:"",rp:"",hp:"",dp:"",fx:""};
    for(var j=0;j<cells.length;j++){
      if(colMap[j]){
        record[colMap[j]]=cells[j].replace(/^\s+|\s+$/g,"").replace(/^"|"$/g,"");
      }
    }
    newData.push(record);
  }

  if(newData.length===0){
    showFeedback("Nenhum registro encontrado nos dados.","err");
    return;
  }

  DATA.length=0;
  DATA_ORIGINAL.length=0;
  for(var i=0;i<newData.length;i++){
    DATA.push(newData[i]);
    DATA_ORIGINAL.push(newData[i]);
  }
  filtered=DATA.slice();

  // Rebuild filters
  buildFilters();

  showFeedback("&#10004; "+fmtNum(newData.length)+" registros carregados, "+mappedCount+" campos mapeados","ok");

  // Reset base panel to allow re-render with new count
  el("panel-base").setAttribute("data-rendered","");
  renderBase();
}

function parseLine(line,sep){
  var result=[];
  var current="";
  var inQuotes=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){
      if(inQuotes&&i+1<line.length&&line[i+1]==='"'){
        current+='"';i++;
      } else {
        inQuotes=!inQuotes;
      }
    } else if(ch===sep&&!inQuotes){
      result.push(current);
      current="";
    } else {
      current+=ch;
    }
  }
  result.push(current);
  return result;
}

  var fb=el("upload-feedback");

  fb.innerHTML="<div class=\"upload-feedback "+(type==="ok"?"upload-ok":"upload-err")+"\">"+msg+"</div>";
}

/* ========== KPI MODAL ========== */
function openKPIModal(){
  var d=filtered;
  var total=d.length;
  var respondidos=0,avaliados=0,notaSum=0,notaCount=0,promotores=0,detratores=0;
  var rvSim=0,rvNao=0,vnSim=0,vnNao=0;
  var tpVals=[];
  var mesmoDia=0,pendentes=0;

  for(var i=0;i<d.length;i++){
    if(d[i].rp==="Sim")respondidos++;
    var nota=parseFloat(d[i].n);
    if(!isNaN(nota)&&d[i].n!==""){
      avaliados++;notaSum+=nota;notaCount++;
      if(nota>=9)promotores++;
      else if(nota<7)detratores++;
    }
    if(d[i].rv==="Sim")rvSim++;
    else if(d[i].rv==="Não")rvNao++;
    if(d[i].vn==="Sim")vnSim++;
    else if(d[i].vn==="Não")vnNao++;
    var tp=parseFloat(d[i].tp);
    if(!isNaN(tp)&&d[i].tp!=="")tpVals.push(tp);
    var fx=classifyFaixa(d[i].fx);
    if(fx==="Mesmo dia")mesmoDia++;
    if(fx==="PENDENTE")pendentes++;
  }
  var notaMedia=notaCount>0?(notaSum/notaCount):0;
  var nps=avaliados>0?Math.round((promotores-detratores)/avaliados*100):0;
  var tempMed=tpVals.length>0?(tpVals.reduce(function(a,b){return a+b},0)/tpVals.length):0;

  var html="<div class=\"modal-header\">";
  html+="<span class=\"modal-title\">Resumo de KPIs</span>";
  html+="<button class=\"modal-close\" onclick=\"closeModal()\">&times;</button>";
  html+="</div>";

  html+="<table class=\"data-table\">";
  html+="<thead><tr><th>Indicador</th><th>Valor</th><th>Detalhe</th></tr></thead><tbody>";

  var kpis=[
    ["Total Reclamações",fmtNum(total),""],
    ["Respondidos",fmtNum(respondidos),fmtPct(respondidos,total)],
    ["Sem Resposta",fmtNum(total-respondidos),fmtPct(total-respondidos,total)],
    ["Avaliados",fmtNum(avaliados),fmtPct(avaliados,total)],
    ["Nota Média",(Math.round(notaMedia*10)/10).toFixed(1),"escala 0-10"],
    ["NPS",nps+"","promotores - detratores"],
    ["Tempo Médio 1ª Resp",Math.round(tempMed)+" min",(tempMed/60).toFixed(1)+"h"],
    ["Mesmo Dia",fmtNum(mesmoDia),fmtPct(mesmoDia,total)],
    ["Pendentes",fmtNum(pendentes),fmtPct(pendentes,total)],
    ["Resolvido Sim",fmtNum(rvSim),fmtPct(rvSim,rvSim+rvNao)],
    ["Resolvido Não",fmtNum(rvNao),fmtPct(rvNao,rvSim+rvNao)],
    ["Voltaria Sim",fmtNum(vnSim),fmtPct(vnSim,vnSim+vnNao)],
    ["Voltaria Não",fmtNum(vnNao),fmtPct(vnNao,vnSim+vnNao)]
  ];

  // Agent breakdown
  var agents=uniqueVals(d,"ag");
  for(var a=0;a<agents.length;a++){
    var ag=agents[a];
    var cnt=0,resp=0,nS=0,nC=0;
    for(var i=0;i<d.length;i++){
      if(d[i].ag===ag){
        cnt++;
        if(d[i].rp==="Sim")resp++;
        var nt=parseFloat(d[i].n);
        if(!isNaN(nt)&&d[i].n!==""){nS+=nt;nC++;}
      }
    }
    var ntM=nC>0?(Math.round(nS/nC*10)/10).toFixed(1):"-";
    kpis.push([ag,fmtNum(cnt)+" tickets","Resp: "+fmtNum(resp)+" | Taxa: "+fmtPct(resp,cnt)+" | Nota: "+ntM]);
  }

  for(var i=0;i<kpis.length;i++){
    html+="<tr><td><strong>"+escHtml(kpis[i][0])+"</strong></td><td>"+escHtml(kpis[i][1])+"</td><td>"+escHtml(kpis[i][2])+"</td></tr>";
  }
  html+="</tbody></table>";
  openModal(html);
}

    csv="Rótulo;Valor\n";
    var items=card.items||[];
    for(var i=0;i<items.length;i++){
      csv+='"'+items[i].label.replace(/"/g,'""')+'";'+items[i].value+"\n";
    }
  } else if(card.type==="table"){
    var headers=card.headers||[];
    csv=headers.join(";")+"\n";
    var rows=card.rows||[];
    for(var i=0;i<rows.length;i++){
      var cells=[];
      for(var j=0;j<rows[i].length;j++){
        var v=rows[i][j]!=null?String(rows[i][j]):"";
        cells.push('"'+v.replace(/"/g,'""')+'"');
      }
      csv+=cells.join(";")+"\n";
    }
  } else if(card.type==="stacked"){
    var cats=card.cats||[];
    csv="Grupo;"+cats.join(";")+"\n";
    var groups=card.groups||[];
    for(var i=0;i<groups.length;i++){
      var vals=['"'+groups[i].label.replace(/"/g,'""')+'"'];
      for(var j=0;j<cats.length;j++){
        vals.push(groups[i].values[cats[j]]||0);
      }
      csv+=vals.join(";")+"\n";
    }
  }
  if(!csv)return;
  var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});

  a.href=url;
  a.download=(card.title||cardId).replace(/[^a-zA-Z0-9À-ÿ ]/g,"")+"_export.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var FROZEN = JSON.parse(localStorage.getItem("kra_frozen") || "[]");

function freezeSnapshot() {
  var d = filtered;
  var total = d.length;
  var resp = d.filter(function(r){return r.rp==="Sim";}).length;
  var semR = total - resp;
  var cn = d.filter(function(r){return r.n && r.n!=="";});
  var notas = cn.map(function(r){return parseFloat(r.n)||0;});
  var avgN = notas.length ? (notas.reduce(function(a,b){return a+b;},0)/notas.length).toFixed(1) : "-";
  var cd = d.filter(function(r){return r.dp && r.dp!=="";});
  var dias = cd.map(function(r){return parseInt(r.dp)||0;});
  var avgD = dias.length ? (dias.reduce(function(a,b){return a+b;},0)/dias.length).toFixed(1) : "-";
  var d0 = cd.filter(function(r){return parseInt(r.dp)===0;}).length;
  var d1 = cd.filter(function(r){return parseInt(r.dp)===1;}).length;
  var d2 = cd.filter(function(r){return parseInt(r.dp)===2;}).length;
  var d3 = cd.filter(function(r){return parseInt(r.dp)===3;}).length;
  var gt3 = cd.filter(function(r){return parseInt(r.dp)>3;}).length;
  var prom = notas.filter(function(n){return n>=9;}).length;
  var neut = notas.filter(function(n){return n>=7&&n<9;}).length;
  var det = notas.filter(function(n){return n<7;}).length;
  var nps = notas.length ? Math.round((prom-det)/notas.length*100) : "-";
  var rS=d.filter(function(r){return r.rv==="Sim";}).length;
  var rN=d.filter(function(r){return r.rv==="Não";}).length;
  var vS=d.filter(function(r){return r.vn==="Sim";}).length;
  var vN=d.filter(function(r){return r.vn==="Não";}).length;
  // Status RA
  var sra={};d.forEach(function(r){var v=r.sr||"?";sra[v]=(sra[v]||0)+1;});
  var sraStr="";for(var k in sra)sraStr+=k+": "+sra[k]+"\n";
  // Status HugMe
  var shm={};d.forEach(function(r){var v=r.sh||"?";shm[v]=(shm[v]||0)+1;});
  var shmStr="";for(var k2 in shm)shmStr+=k2+": "+shm[k2]+"\n";
  // Top motivos
  var mot={};d.forEach(function(r){var v=r.mt||"?";mot[v]=(mot[v]||0)+1;});
  var motArr=[];for(var k3 in mot)motArr.push([k3,mot[k3]]);
  motArr.sort(function(a,b){return b[1]-a[1];});
  var motStr="";for(var m=0;m<Math.min(10,motArr.length);m++)motStr+=motArr[m][0]+": "+motArr[m][1]+"\n";
  // Top estados
  var est={};d.forEach(function(r){var v=r.e||"?";est[v]=(est[v]||0)+1;});
  var estArr=[];for(var k4 in est)estArr.push([k4,est[k4]]);
  estArr.sort(function(a,b){return b[1]-a[1];});
  var estStr="";for(var e2=0;e2<Math.min(10,estArr.length);e2++)estStr+=estArr[e2][0]+": "+estArr[e2][1]+"\n";
  // Agentes completo
  var agentes = {};
  d.forEach(function(r){
    var ag = r.ag || "(N/A)";
    if(!agentes[ag]) agentes[ag]={t:0,r:0,d0:0,gt3:0,ns:[],pend:0};
    agentes[ag].t++;
    if(r.rp==="Sim") agentes[ag].r++;
    if(r.dp!==""&&parseInt(r.dp)===0) agentes[ag].d0++;
    if(r.dp!==""&&parseInt(r.dp)>3) agentes[ag].gt3++;
    if(r.rp==="Não") agentes[ag].pend++;
    if(r.n && r.n!=="") agentes[ag].ns.push(parseFloat(r.n)||0);
  });
  var agArr=[];
  for(var ka in agentes){
    var a=agentes[ka];
    var an=a.ns.length?(a.ns.reduce(function(x,y){return x+y;},0)/a.ns.length).toFixed(1):"-";
    agArr.push({nm:ka,t:a.t,r:a.r,d0:a.d0,gt3:a.gt3,pend:a.pend,nota:an,taxa:a.t?(a.r/a.t*100).toFixed(0):0});
  }
  // Notas por motivo (analise)
  var notaMot={};
  cn.forEach(function(r){
    var m2=r.mt||"?";
    if(!notaMot[m2])notaMot[m2]={ns:[],t:0};
    notaMot[m2].ns.push(parseFloat(r.n)||0);
    notaMot[m2].t++;
  });
  var notaMotArr=[];
  for(var km in notaMot){
    var nm2=notaMot[km];
    var avg2=nm2.ns.reduce(function(a2,b2){return a2+b2;},0)/nm2.ns.length;
    notaMotArr.push({mot:km,avg:avg2.toFixed(1),cnt:nm2.t});
  }
  notaMotArr.sort(function(a3,b3){return parseFloat(a3.avg)-parseFloat(b3.avg);});

  var label = prompt("Nome do snapshot (ex: Sem 35, Ago/2026):");
  if(!label) return;
  FROZEN.push({
    lb:label, dt:new Date().toISOString().split("T")[0],
    total:total, resp:resp, sem:semR,
    d0:d0, d1:d1, d2:d2, d3:d3, gt3:gt3,
    avgD:avgD, avgN:avgN, nps:nps,
    prom:prom, neut:neut, det:det,
    rS:rS, rN:rN, vS:vS, vN:vN,
    sra:sraStr, shm:shmStr, mot:motStr, est:estStr,
    ag:agArr, notaMot:notaMotArr
  });
  localStorage.setItem("kra_frozen", JSON.stringify(FROZEN));
  renderFrozen();
  alert("Snapshot \""+label+"\" congelado com TODOS os resultados!");
}

function renderFrozen() {
  var el2 = document.getElementById("frozen-area");
  if(!FROZEN.length){el2.innerHTML="";return;}
  var h = "<div style='background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 16px;margin-bottom:12px'>";
  h += "<div style='font-weight:700;color:#d97706;margin-bottom:8px;font-size:13px'>&#128274; Historico Congelado (clique no nome para ver todos os resultados)</div>";
  for(var i=0;i<FROZEN.length;i++){
    var s=FROZEN[i];
    h+="<div style='display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:6px 8px;background:#fff;border-radius:5px;margin-bottom:4px;font-size:12px'>";
    h+="<a href='#' onclick='showFrozenDetail("+i+");return false;' style='font-weight:700;min-width:120px;color:#2563eb;text-decoration:underline;cursor:pointer'>"+escHtml(s.lb)+"</a>";
    h+="<span style='color:#9ca3af;font-size:10px'>"+s.dt+"</span>";
    h+="<span><b>Total:</b> "+s.total+"</span>";
    h+="<span><b>Resp:</b> "+s.resp+"</span>";
    h+="<span style='color:#dc2626'><b>S/Resp:</b> "+s.sem+"</span>";
    h+="<span><b>Nota:</b> "+s.avgN+"</span>";
    h+="<span><b>NPS:</b> "+s.nps+"</span>";
    h+="<button onclick='removeFrozen("+i+")' style='padding:1px 6px;border:1px solid #dc2626;background:#fef2f2;color:#dc2626;border-radius:3px;cursor:pointer;font-size:9px'>&#10005;</button>";

  }
  h+="</div>";
  el2.innerHTML=h;
}

function removeFrozen(idx) {
  if(!confirm("Remover snapshot \""+FROZEN[idx].lb+"\"?")) return;
  FROZEN.splice(idx,1);
  localStorage.setItem("kra_frozen",JSON.stringify(FROZEN));
  renderFrozen();
}

function exportFrozenHTML(){
  if(!FROZEN.length){alert("Nenhum snapshot congelado.");return;}
  var h=buildFrozenHTMLContent();
  var blob=new Blob([h],{type:"text/html;charset=utf-8"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");
  a.href=url;a.download="snapshots_congelados.html";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function exportFrozenPDF(){
  if(!FROZEN.length){alert("Nenhum snapshot congelado.");return;}

  var w=window.open("","_blank");
  w.document.write(h);
  w.document.close();

}
